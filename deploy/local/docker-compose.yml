# Reproducible local demo topology: OpenEMR/MariaDB and the AI server run as
# separate services with persistent named volumes, fronted by a local-only Caddy
# ingress (TICK-023). There is no public ingress or cloud provisioning here (see
# TICK-005/README for OCI deployment, which is out of scope for this file).
#
# Usage: from this directory, `cp .env.example .env`, fill in .env, then
# `docker compose up -d`. See README.md for the full walkthrough.
services:
  mariadb:
    # Pinned to the same release the upstream OpenEMR v8.3.0 production compose file
    # uses, so the local topology matches the pinned OpenEMR release it serves.
    image: mariadb:11.8.8
    restart: unless-stopped
    command: ["mariadbd", "--character-set-server=utf8mb4"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD in deploy/local/.env}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      start_period: 1m
      start_interval: 10s
      interval: 1m
      timeout: 5s
      retries: 3
    networks:
      - emr

  openemr:
    # Pinned stable release per TICK-001's endpoint matrix (evidence/TICK-001);
    # never tracks an unversioned/"latest" tag (NFR-15).
    image: openemr/openemr:8.3.0
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      MYSQL_HOST: mariadb
      MYSQL_ROOT_PASS: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD in deploy/local/.env}
      MYSQL_USER: ${OPENEMR_MYSQL_USER:?set OPENEMR_MYSQL_USER in deploy/local/.env}
      MYSQL_PASS: ${OPENEMR_MYSQL_PASSWORD:?set OPENEMR_MYSQL_PASSWORD in deploy/local/.env}
      OE_USER: ${OPENEMR_ADMIN_USER:?set OPENEMR_ADMIN_USER in deploy/local/.env}
      OE_PASS: ${OPENEMR_ADMIN_PASSWORD:?set OPENEMR_ADMIN_PASSWORD in deploy/local/.env}
      # Read by the aeai-portal-chat module (TICK-012) as the iframe's only src; the
      # local default points at Caddy's chat hostname, never at OpenEMR itself.
      AEAI_PORTAL_CHAT_URL: ${AEAI_PORTAL_CHAT_URL:-https://chat.localhost/oauth/launch}
    ports:
      - "${OPENEMR_HTTP_PORT:-8080}:80"
      - "${OPENEMR_HTTPS_PORT:-8443}:443"
    volumes:
      - openemr-sites:/var/www/localhost/htdocs/openemr/sites
      - openemr-logs:/var/log
      # The patient-portal AI chat entry (TICK-012), bind-mounted read-only into the
      # pinned image's custom-module directory rather than baking a forked image.
      - ../../openemr_modules/aeai-portal-chat:/var/www/localhost/htdocs/openemr/interface/modules/custom_modules/aeai-portal-chat:ro
      # TICK-037: a targeted patch to a bug in this pinned release's own OAuth
      # consent-screen template (see openemr_overrides/templates/oauth2/scope-authorize.html.twig
      # for the full explanation), not a custom feature -- same bind-mount-over-vendor-path
      # approach as the module mount above, applied to a single core file instead.
      - ../../openemr_overrides/templates/oauth2/scope-authorize.html.twig:/var/www/localhost/htdocs/openemr/templates/oauth2/scope-authorize.html.twig:ro
    healthcheck:
      test:
        [
          "CMD",
          "/usr/bin/curl",
          "--fail",
          "--insecure",
          "--location",
          "--show-error",
          "--silent",
          "https://localhost/meta/health/readyz",
        ]
      start_period: 3m
      start_interval: 10s
      interval: 1m
      timeout: 5s
      retries: 3
    networks:
      - emr
      - app

  caddy:
    # Pinned patch release, matching the pinning convention used for mariadb/openemr
    # above (NFR-15).
    image: caddy:2.9.1-alpine
    restart: unless-stopped
    depends_on:
      - openemr
      - ai-server
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    networks:
      app:
        # Lets both the host browser and other containers (e.g. the AI server's
        # OAuth calls) reach OpenEMR/the AI server through the same hostnames
        # (README.md step 3, TICK-023).
        aliases:
          - emr.localhost
          - chat.localhost

  ai-server:
    build:
      context: ../..
      dockerfile: deploy/local/ai-server.Dockerfile
    restart: unless-stopped
    depends_on:
      - openemr
    environment:
      # Session volume: SQLite WAL state on a persistent named volume (NFR-31).
      AI_SESSION_DATABASE_PATH: /data/ai_session.sqlite3
      AI_SESSION_ENCRYPTION_KEY: ${AI_SESSION_ENCRYPTION_KEY:?set AI_SESSION_ENCRYPTION_KEY in deploy/local/.env}
      OPENEMR_OAUTH_AUTHORIZE_URL: ${OPENEMR_OAUTH_AUTHORIZE_URL:?set OPENEMR_OAUTH_AUTHORIZE_URL in deploy/local/.env}
      OPENEMR_OAUTH_TOKEN_URL: ${OPENEMR_OAUTH_TOKEN_URL:?set OPENEMR_OAUTH_TOKEN_URL in deploy/local/.env}
      OPENEMR_OAUTH_JWKS_URL: ${OPENEMR_OAUTH_JWKS_URL:?set OPENEMR_OAUTH_JWKS_URL in deploy/local/.env}
      OPENEMR_OAUTH_ISSUER: ${OPENEMR_OAUTH_ISSUER:?set OPENEMR_OAUTH_ISSUER in deploy/local/.env}
      OPENEMR_OAUTH_CLIENT_ID: ${OPENEMR_OAUTH_CLIENT_ID:?set OPENEMR_OAUTH_CLIENT_ID in deploy/local/.env}
      OPENEMR_OAUTH_CLIENT_SECRET: ${OPENEMR_OAUTH_CLIENT_SECRET:?set OPENEMR_OAUTH_CLIENT_SECRET in deploy/local/.env}
      OPENEMR_OAUTH_REDIRECT_URI: ${OPENEMR_OAUTH_REDIRECT_URI:?set OPENEMR_OAUTH_REDIRECT_URI in deploy/local/.env}
      AI_SESSION_SUCCESS_REDIRECT_URI: ${AI_SESSION_SUCCESS_REDIRECT_URI:?set AI_SESSION_SUCCESS_REDIRECT_URI in deploy/local/.env}
      # Default LLM path requires no paid service (NFR-20); GROQ_API_KEY is Groq's
      # free tier and is optional until chat/LLM endpoints are wired in.
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_ZDR_VERIFIED_ON: ${GROQ_ZDR_VERIFIED_ON:-}
      # Real appointment booking (TICK-034) and cancellation (TICK-036): optional,
      # same tolerance as GROQ_API_KEY above -- absent, the chat tool falls back to
      # its fixed no-action summary instead of failing startup. AI_BOOKING_* are this
      # office's admin-configured appointment fields (ai_server/app/chat.py,
      # BookingToolSettings); they have no discoverable default
      # (ai_server/scheduling/booking.py, AppointmentRequest).
      OPENEMR_API_BASE_URL: ${OPENEMR_API_BASE_URL:-}
      OPENEMR_FHIR_BASE_URL: ${OPENEMR_FHIR_BASE_URL:-}
      OPENEMR_PORTAL_BASE_URL: ${OPENEMR_PORTAL_BASE_URL:-}
      AI_BOOKING_CATEGORY_ID: ${AI_BOOKING_CATEGORY_ID:-}
      AI_BOOKING_TITLE: ${AI_BOOKING_TITLE:-}
      AI_BOOKING_FACILITY_ID: ${AI_BOOKING_FACILITY_ID:-}
      AI_BOOKING_BILLING_LOCATION_ID: ${AI_BOOKING_BILLING_LOCATION_ID:-}
      AI_BOOKING_PROVIDER_ID: ${AI_BOOKING_PROVIDER_ID:-}
    # No host port: the internal AI port is reachable only from other containers
    # on the `app` network (Caddy's chat hostname), never directly from the host.
    volumes:
      - ai-session-data:/data
    networks:
      - app

networks:
  # OpenEMR<->MariaDB traffic stays off the ai-server's network; the AI server must
  # never connect to MariaDB directly (ARCHITECTURE.md §4). Caddy joins only `app`,
  # so it cannot reach MariaDB either.
  emr:
  app:

volumes:
  mariadb-data:
  openemr-sites:
  openemr-logs:
  ai-session-data:
  caddy-data:
  caddy-config:
